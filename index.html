<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0E1430" />
  <meta name="description" content="Cùng Mây gom đom đóm, thắp sáng ba hòn đảo và đưa ánh sáng trở về biển mây." />
  <title>Đảo Đèn Lồng · Ba hòn đảo</title>
</head>
<body>
  <div id="app" aria-label="Thế giới Đảo Đèn Lồng"></div>
  <div id="flash" aria-hidden="true"></div>
  <header id="hud" hidden>
    <div class="vital"><span class="label">Ngọn Lửa</span><strong id="flames">● ● ●</strong><span id="nightLabel">Đêm 1 · Đảo Bến</span></div>
    <div id="clock"><span class="label">Trước bình minh</span><span id="dangerMarker" hidden>⚠ </span><strong id="time">4:00</strong><span id="wind"></span><span id="countdownCaption"></span></div>
    <div class="progress"><div><span class="label" id="goalLabel">Giữ ≥3 đèn tới bình minh</span><strong id="lanternCount">0/5</strong></div><div><span class="label">Điểm</span><strong id="score">0</strong></div></div>
  </header>
  <div id="bottomHud" hidden>
    <div id="keyGuide" class="key-guide">WASD di chuyển · Chuột xoay · Space nhảy · P tạm dừng</div>
    <div id="bag"><div id="interactHint" hidden>E — Nạp ánh sáng</div><div class="label">Đom đóm <b id="carryCount">0/10</b></div><div id="slots"></div><div id="charm"></div><div id="fuelStatus"></div></div>
    <div class="abilities"><div><kbd id="dashKey">Shift</kbd><span>Lướt<small id="dashCd">Sẵn sàng</small></span></div><div><kbd id="pulseKey">Q</kbd><span>Tỏa Sáng<small id="pulseCd">Cần 3 đom đóm</small></span></div></div>
  </div>
  <div id="direction" hidden><span id="arrow">↑</span><span id="target"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="spawnCues" aria-live="polite"></div>
  <main id="panel" aria-label="Menu trò chơi"></main>
  <div id="boot">Đang dựng thế giới…</div>
  <noscript>Bật JavaScript để chơi Đảo Đèn Lồng.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
