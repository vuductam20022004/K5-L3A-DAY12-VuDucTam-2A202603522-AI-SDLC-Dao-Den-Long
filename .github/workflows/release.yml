name: Release v1.0.0
on:
  push:
    tags: ['v1.0.0']
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/tags/v1.0.0' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish runnable ZIP and demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 artifacts/release/dao-den-long-v1.0.0.zip artifacts/release/SHA256SUMS.txt docs/demo/demo.mp4 bench.json soak.json --title "Bình minh — v1.0.0" --notes-file docs/release/v1.0.0.md --verify-tag
